<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Learning | LearnoSphere</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        .visual-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .visual-select {
            padding: 10px 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        #plotDiv {
            width: 100%;
            height: 500px;
            border: 2px solid #eee;
            border-radius: 10px;
            background: white;
        }
    </style>
</head>

<body class="dashboard-body">
    <nav class="sidebar">
        <div class="brand">
            <h1>🚀 LearnoSphere</h1>
        </div>
        <ul class="nav-links">
            <li><a href="/">Dashboard</a></li>
            <li><a href="/courses">Courses</a></li>
            <li><a href="/tools/concept-generator">🧠 Concept Generator</a></li>
            <li><a href="/tools/code-playground">💻 Code Playground</a></li>
            <li class="active"><a href="/tools/visuals">📊 Visual Learning</a></li>
            <li><a href="/tools/audio-player">🔊 Audio Player</a></li>
            <li><a href="/community">Community</a></li>
        </ul>
        <div class="user-profile-mini">
            <img src="{{ user.picture }}" alt="Profile" class="avatar-small">
            <span>{{ user.name }}</span>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </nav>

    <main class="main-content">
        <header class="dashboard-header">
            <h2>📊 Visual Learning Panel</h2>
            <p style="margin: 5px 0; color: #666;">Interactive visualizations for ML concepts</p>
        </header>

        <div class="card" style="margin: 20px;">
            <div class="visual-controls">
                <h3 style="margin: 0;">Select Visualization</h3>
                <select id="visualSelect" class="visual-select" onchange="updateVisual()">
                    <option value="sigmoid">Sigmoid Function (Logistic Regression)</option>
                    <option value="loss">Training Loss Curve</option>
                    <option value="linear">Linear Regression</option>
                    <option value="scatter">Classification Scatter Plot</option>
                </select>
            </div>
            <div id="plotDiv"></div>
        </div>
    </main>

    <script>
        function updateVisual() {
            const type = document.getElementById('visualSelect').value;

            if (type === 'sigmoid') {
                const x = [];
                const y = [];
                for (let i = -6; i <= 6; i += 0.1) {
                    x.push(i);
                    y.push(1 / (1 + Math.exp(-i)));
                }
                const trace = { x: x, y: y, type: 'scatter', mode: 'lines', name: 'Sigmoid', line: { color: '#0072ff', width: 3 } };
                const layout = {
                    title: 'Sigmoid Function (σ(x) = 1 / (1 + e^(-x)))',
                    xaxis: { title: 'Input (x)', gridcolor: '#eee' },
                    yaxis: { title: 'Output (0 to 1)', gridcolor: '#eee' },
                    plot_bgcolor: '#f9f9f9'
                };
                Plotly.newPlot('plotDiv', [trace], layout);

            } else if (type === 'loss') {
                const epochs = Array.from({ length: 50 }, (_, i) => i + 1);
                const loss = epochs.map(e => 2 / e + (Math.random() * 0.1));
                const trace = {
                    x: epochs, y: loss, type: 'scatter', mode: 'lines+markers',
                    name: 'Loss', line: { color: '#ff4757', width: 2 },
                    marker: { size: 6 }
                };
                const layout = {
                    title: 'Training Loss Over Epochs',
                    xaxis: { title: 'Epoch' },
                    yaxis: { title: 'Loss Value' },
                    plot_bgcolor: '#f9f9f9'
                };
                Plotly.newPlot('plotDiv', [trace], layout);

            } else if (type === 'linear') {
                const x = Array.from({ length: 50 }, () => Math.random() * 10);
                const y = x.map(val => 2 * val + 3 + (Math.random() - 0.5) * 3);
                const trace1 = {
                    x: x, y: y, mode: 'markers', type: 'scatter',
                    name: 'Data Points', marker: { color: '#5352ed', size: 8 }
                };
                const trace2 = {
                    x: [0, 10], y: [3, 23], mode: 'lines', type: 'scatter',
                    name: 'Best Fit Line', line: { color: '#ff4757', width: 3 }
                };
                const layout = {
                    title: 'Linear Regression Example (y = 2x + 3)',
                    xaxis: { title: 'X' },
                    yaxis: { title: 'Y' },
                    plot_bgcolor: '#f9f9f9'
                };
                Plotly.newPlot('plotDiv', [trace1, trace2], layout);

            } else if (type === 'scatter') {
                const class0x = Array.from({ length: 30 }, () => Math.random() * 5);
                const class0y = Array.from({ length: 30 }, () => Math.random() * 5);
                const class1x = Array.from({ length: 30 }, () => 5 + Math.random() * 5);
                const class1y = Array.from({ length: 30 }, () => 5 + Math.random() * 5);

                const trace1 = {
                    x: class0x, y: class0y, mode: 'markers', type: 'scatter',
                    name: 'Class 0', marker: { color: '#3742fa', size: 10 }
                };
                const trace2 = {
                    x: class1x, y: class1y, mode: 'markers', type: 'scatter',
                    name: 'Class 1', marker: { color: '#ff4757', size: 10 }
                };
                const layout = {
                    title: 'Binary Classification Scatter Plot',
                    xaxis: { title: 'Feature 1' },
                    yaxis: { title: 'Feature 2' },
                    plot_bgcolor: '#f9f9f9'
                };
                Plotly.newPlot('plotDiv', [trace1, trace2], layout);
            }
        }

        updateVisual();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ topic.title }} | Web Course</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css" rel="stylesheet">
    <style>
        .playground-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: calc(100vh - 120px);
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .explanation-panel {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .preview-panel {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .preview-header {
            background: #f1f1f1;
            padding: 10px;
            font-size: 0.8rem;
            color: #666;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
        }

        #live-preview {
            width: 100%;
            flex-grow: 1;
            border: none;
            background: white;
        }

        .code-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }

        .editor-container {
            flex-grow: 1;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .CodeMirror {
            height: 100%;
            font-size: 16px;
        }

        .requirement-box {
            background: rgba(245, 87, 108, 0.1);
            border-left: 4px solid #f5576c;
            padding: 15px;
            margin: 15px 0;
            border-radius: 0 8px 8px 0;
        }

        .verify-btn {
            padding: 15px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .verify-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        .message-toast {
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .message-success {
            background: rgba(76, 209, 55, 0.2);
            border: 1px solid #4cd137;
            color: #4cd137;
        }

        .message-error {
            background: rgba(232, 65, 24, 0.2);
            border: 1px solid #e84118;
            color: #e84118;
        }
    </style>
</head>

<body class="dashboard-body">
    {% include 'sidebar.html' ignore missing %}

    <main class="main-content">
        <header class="dashboard-header">
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="/courses/web" class="btn" style="width: auto; padding: 8px 15px;">← Back</a>
                <h2>Topic {{ topic.id }}: {{ topic.title }}</h2>
            </div>
        </header>

        <div class="playground-container">
            <div class="left-panel">
                <div class="explanation-panel">
                    <h3>The Concept</h3>
                    <p>{{ topic.explanation }}</p>

                    <div class="requirement-box">
                        <strong>Your Task:</strong><br>
                        {{ topic.requirement }}
                    </div>
                </div>

                <div class="code-panel" data-topic-id="{{ topic.id }}">
                    <div class="editor-container">
                        <textarea id="editor">{{ topic.starter_code or "<!-- Write HTML here -->\n" }}</textarea>
                    </div>

                    <button class="verify-btn" onclick="verifyCode()">Run & Verify Code</button>
                    <div id="feedback-msg" class="message-toast"></div>
                </div>
            </div>

            <div class="preview-panel">
                <div class="preview-header">
                    <span>Live Preview</span>
                    <span>index.html</span>
                </div>
                <iframe id="live-preview"></iframe>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/htmlmixed/htmlmixed.min.js"></script>
    <script>
        const editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
            mode: 'htmlmixed',
            theme: 'dracula',
            lineNumbers: true,
            indentUnit: 4,
            autoCloseBrackets: true,
            autoCloseTags: true
        });

        const previewFrame = document.getElementById('live-preview');

        function updatePreview() {
            const content = editor.getValue();
            const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            doc.open();
            doc.write(content);
            doc.close();
        }

        editor.on('change', updatePreview);
        updatePreview(); // Initial preview

        async function verifyCode() {
            const btn = document.querySelector('.verify-btn');
            const feedback = document.getElementById('feedback-msg');

            btn.innerHTML = "Verifying...";
            btn.disabled = true;

            const topicId = document.querySelector('.code-panel').dataset.topicId;
            const response = await fetch('/courses/web/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    topic_id: parseInt(topicId),
                    code: editor.getValue()
                })
            });

            const result = await response.json();

            btn.innerHTML = "Run & Verify Code";
            btn.disabled = false;

            feedback.style.display = 'block';
            feedback.innerHTML = result.message;
            feedback.className = 'message-toast ' + (result.success ? 'message-success' : 'message-error');

            if (result.success) {
                setTimeout(() => {
                    if (confirm("Great job! Want to move to the next topic?")) {
                        window.location.href = "/courses/web";
                    }
                }, 1000);
            }
        }
    </script>
</body>

</html>

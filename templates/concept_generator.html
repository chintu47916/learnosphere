<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Concept Generator | LearnoSphere</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .concept-input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            align-items: center;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .concept-input {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .concept-input:focus {
            border-color: #0072ff;
        }

        .level-select {
            padding: 12px 20px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            font-size: 15px;
            background: white;
            cursor: pointer;
        }

        .concept-btn {
            padding: 14px 35px;
            background: #0072ff;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, background 0.2s;
        }

        .concept-btn:hover {
            background: #0056cc;
            transform: scale(1.02);
        }

        .concept-output {
            display: none;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-top: 20px;
            line-height: 1.7;
            font-size: 16px;
            color: #3c4043;
        }

        .concept-content {
            margin-top: 15px;
        }

        .concept-content h1,
        .concept-content h2,
        .concept-content h3 {
            color: #1a73e8;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .concept-content p {
            margin-bottom: 15px;
        }

        .concept-content pre {
            background: #202124;
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            overflow-x: auto;
        }

        .concept-content code {
            font-family: 'Consolas', monospace;
            font-size: 14px;
        }

        .audio-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .speak-btn {
            background: #f1f3f4;
            color: #3c4043;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .speak-btn:hover {
            background: #e8eaed;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #5f6368;
        }

        .dot-pulse {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #0072ff;
            margin: 0 5px;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="dashboard-body">
    <nav class="sidebar">
        <div class="brand">
            <h1>🚀 LearnoSphere</h1>
        </div>
        <ul class="nav-links">
            <li><a href="/">Dashboard</a></li>
            <li><a href="/courses">Courses</a></li>
            <li class="active"><a href="/tools/concept-generator">🧠 Concept Generator</a></li>
            <li><a href="/tools/code-playground">💻 Code Playground</a></li>
            <li><a href="/tools/visuals">📊 Visual Learning</a></li>
            <li><a href="/tools/audio-player">🔊 Audio Player</a></li>
            <li><a href="/community">Community</a></li>
        </ul>
        <div class="user-profile-mini">
            <img src="{{ user.picture }}" alt="Profile" class="avatar-small">
            <span>{{ user.name }}</span>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </nav>

    <main class="main-content">
        <header class="dashboard-header">
            <h2>🧠 AI Concept Generator</h2>
            <p style="margin: 5px 0; color: #666;">Get clear, Gemini-style explanations for any subject</p>
        </header>

        <div style="max-width: 1000px; margin: 0 auto; padding: 20px;">
            <div class="concept-input-group">
                <input type="text" id="topicInput" class="concept-input"
                    placeholder="Enter a concept (e.g., Recursion, Photosynthesis, Machine Learning)...">
                <select id="levelSelect" class="level-select">
                    <option value="Beginner">🌱 Beginner</option>
                    <option value="Intermediate" selected>⚡ Intermediate</option>
                    <option value="Advanced">🚀 Advanced</option>
                </select>
                <button class="concept-btn" onclick="generateConcept()">Generate</button>
            </div>

            <div id="conceptOutput" class="concept-output">
                <div class="audio-controls">
                    <h3 id="outputTitle" style="margin: 0; color: #1a73e8;">Lesson Title</h3>
                    <button class="speak-btn" onclick="toggleSpeech()">
                        <span id="speakerIcon">🔊</span> <span id="speakerText">Listen</span>
                    </button>
                </div>

                <div id="conceptContent" class="concept-content">
                    <!-- AI Content will appear here -->
                </div>
            </div>
        </div>
    </main>

    <script>
        const chatInput = document.getElementById('topicInput');
        const outputDiv = document.getElementById('conceptOutput');
        const contentDiv = document.getElementById('conceptContent');
        const titleH3 = document.getElementById('outputTitle');
        let currentUtterance = null;

        marked.setOptions({
            breaks: true,
            gfm: true
        });

        async function typeWriter(text) {
            contentDiv.innerHTML = '';
            const tokens = text.split(' ');
            let currentStr = '';

            for (let i = 0; i < tokens.length; i++) {
                currentStr += tokens[i] + ' ';
                contentDiv.innerHTML = marked.parse(currentStr);

                // Simple auto-scroll
                const bottom = outputDiv.offsetTop + outputDiv.offsetHeight;
                if (window.scrollY + window.innerHeight < bottom) {
                    window.scrollTo({ top: bottom - 200, behavior: 'auto' });
                }

                await new Promise(r => setTimeout(r, 25));
            }
        }

        async function generateConcept() {
            const topic = chatInput.value.trim();
            const level = document.getElementById('levelSelect').value;

            if (!topic) {
                alert('Please enter a concept to explain');
                return;
            }

            // Reset UI
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            outputDiv.style.display = 'block';
            titleH3.innerText = topic;
            contentDiv.innerHTML = `
                <div class="loading">
                    <div class="dot-pulse"></div>
                    <div class="dot-pulse" style="animation-delay: 0.2s"></div>
                    <div class="dot-pulse" style="animation-delay: 0.4s"></div>
                    <p style="margin-top: 20px;">Gemini is generating your lesson...</p>
                </div>`;

            try {
                const response = await fetch('/tools/generate-concept', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, level })
                });

                const data = await response.json();

                if (data.response) {
                    await typeWriter(data.response);
                } else {
                    contentDiv.innerHTML = `<p style="color: red;">Error: ${data.error || 'Failed to generate response'}</p>`;
                }
            } catch (error) {
                console.error('API Error:', error);
                contentDiv.innerHTML = `<p style="color: red;">Failed to connect to AI service. Please try again.</p>`;
            }
        }

        function toggleSpeech() {
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                document.getElementById('speakerIcon').innerText = '🔊';
                document.getElementById('speakerText').innerText = 'Listen';
            } else {
                const text = contentDiv.innerText;
                if (!text) return;

                currentUtterance = new SpeechSynthesisUtterance(text);
                currentUtterance.rate = 1.0;

                currentUtterance.onend = () => {
                    document.getElementById('speakerIcon').innerText = '🔊';
                    document.getElementById('speakerText').innerText = 'Listen';
                };

                window.speechSynthesis.speak(currentUtterance);
                document.getElementById('speakerIcon').innerText = '🛑';
                document.getElementById('speakerText').innerText = 'Stop';
            }
        }

        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') generateConcept();
        });
    </script>
</body>

</html>
